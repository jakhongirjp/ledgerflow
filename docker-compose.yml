services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  ledgerd:
    build: { context: ., args: { TARGET: ledgerd } }
    environment: &env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  relay:
    build: { context: ., args: { TARGET: relay } }
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
    deploy:
      replicas: 2 # SKIP LOCKED lets replicas share the outbox safely
